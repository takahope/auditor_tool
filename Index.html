<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 條碼掃描庫 Quagga2 -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Roboto", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
        background-color: #f0ebf8;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }

      .container {
        max-width: 760px;
        margin: 0 auto;
        width: 100%;
        padding: 16px;
      }

      /* 標題卡片 */
      .header-card {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      .header-banner {
        height: 12px;
        background: linear-gradient(90deg, #673ab7 0%, #512da8 100%);
      }

      .header-content {
        padding: 32px 24px;
      }

      h1 {
        color: #202124;
        font-size: 32px;
        margin: 0;
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: 0;
      }

      /* 問題卡片 */
      .question-card {
        background: white;
        border-radius: 8px;
        padding: 28px 24px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      .question-card h2 {
        color: #202124;
        font-size: 17px;
        font-weight: 400;
        margin: 0 0 24px 0;
        padding: 0;
        border: none;
        line-height: 1.4;
      }

      .required-indicator {
        color: #d93025;
        margin-left: 4px;
      }

      form {
        background: transparent;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        margin: 0;
      }

      /* 表單輸入欄位 */
      select, textarea, input[type="text"] {
        width: 100%;
        padding: 14px 16px;
        border-radius: 4px;
        border: 1px solid #dadce0;
        font-size: 17px;
        font-family: inherit;
        transition: border-color 0.2s;
        background-color: #fff;
        color: #202124;
        line-height: 1.5;
      }

      select:hover, textarea:hover, input[type="text"]:hover {
        border-color: #80868b;
      }

      select:focus, textarea:focus, input[type="text"]:focus {
        outline: none;
        border-color: #673ab7;
        border-width: 2px;
        padding: 13px 15px;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
        line-height: 1.6;
      }

      /* 勾選框區域 */
      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 0;
        cursor: pointer;
        min-height: 48px;
      }

      .checkbox-item input[type="checkbox"] {
        width: 24px;
        height: 24px;
        cursor: pointer;
        flex-shrink: 0;
        accent-color: #673ab7;
        margin: 0;
      }

      .checkbox-item label {
        font-size: 17px;
        color: #202124;
        cursor: pointer;
        line-height: 1.5;
        margin: 0;
        font-weight: 400;
      }

      /* 提交按鈕 */
      .submit-card {
        background: white;
        border-radius: 8px;
        padding: 28px 24px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      input[type="submit"] {
        background: #673ab7;
        color: white;
        padding: 12px 28px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 500;
        transition: background 0.2s, box-shadow 0.2s;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        min-height: 48px;
        width: auto;
      }

      input[type="submit"]:hover {
        background: #5e35b1;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.15);
      }

      input[type="submit"]:active {
        background: #512da8;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      #status {
        margin-top: 20px;
        padding: 14px;
        border-radius: 4px;
        font-size: 15px;
        text-align: center;
        background-color: #e8f5e9;
        color: #2e7d32;
        display: none;
        line-height: 1.5;
      }

      #status.show {
        display: block;
      }

      /* 移動版響應式 (≤768px) */
      @media screen and (max-width: 768px) {
        body {
          padding: 12px;
        }

        .container {
          padding: 0;
        }

        .header-banner {
          height: 10px;
        }

        .header-content {
          padding: 28px 20px;
        }

        h1 {
          font-size: 26px;
        }

        .question-card {
          padding: 24px 20px;
        }

        .question-card h2 {
          font-size: 16px;
          margin-bottom: 20px;
        }

        .checkbox-item {
          padding: 16px 0;
          min-height: 56px;
          gap: 20px;
        }

        .checkbox-item input[type="checkbox"] {
          width: 22px;
          height: 22px;
        }

        .checkbox-item label {
          font-size: 16px;
        }

        select, textarea, input[type="text"] {
          font-size: 16px;
          padding: 13px 15px;
        }

        select:focus, textarea:focus, input[type="text"]:focus {
          padding: 12px 14px;
        }

        .submit-card {
          padding: 24px 20px;
        }

        input[type="submit"] {
          width: 100%;
          padding: 13px 28px;
          font-size: 15px;
          min-height: 56px;
        }

        #status {
          font-size: 14px;
          padding: 12px;
        }
      }

      /* 小螢幕響應式 (≤400px) */
      @media screen and (max-width: 400px) {
        body {
          padding: 8px;
        }

        .header-content {
          padding: 24px 16px;
        }

        h1 {
          font-size: 22px;
        }

        .question-card {
          padding: 20px 16px;
        }

        .question-card h2 {
          font-size: 15px;
          margin-bottom: 16px;
        }

        .checkbox-item {
          padding: 14px 0;
          min-height: 52px;
          gap: 16px;
        }

        .checkbox-item label {
          font-size: 15px;
        }

        select, textarea, input[type="text"] {
          font-size: 15px;
          padding: 12px 14px;
        }

        select:focus, textarea:focus, input[type="text"]:focus {
          padding: 11px 13px;
        }

        .submit-card {
          padding: 20px 16px;
        }

        input[type="submit"] {
          padding: 12px 24px;
          min-height: 52px;
        }

        #status {
          font-size: 13px;
          padding: 10px;
        }
      }

      /* ==================== 進度條樣式 ==================== */

      /* 遮罩層 */
      .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.75);
        z-index: 9999;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }

      /* 進度條容器 */
      .progress-bar-container {
        width: 80%;
        max-width: 400px;
        background-color: #555;
        border-radius: 10px;
        border: 1px solid #777;
        overflow: hidden;
      }

      /* 進度條本身 */
      .progress-bar {
        width: 0%;
        height: 20px;
        background-color: #673ab7;
        text-align: center;
        line-height: 20px;
        color: white;
        font-size: 12px;
        font-weight: bold;
        transition: width 0.3s ease-in-out;
      }

      /* 提示文字 */
      .loading-text {
        margin-top: 15px;
        font-size: 18px;
        letter-spacing: 1px;
      }

      /* ==================== 條碼掃描相關樣式 ==================== */
      #scanner-reader video,
      #scanner-reader canvas {
        width: 100% !important;
        height: auto !important;
        max-height: 300px;
        object-fit: cover;
      }

      #scanner-reader canvas.drawingBuffer {
        position: absolute;
        top: 0;
        left: 0;
      }

      @keyframes scanSuccess {
        0% { background-color: #34a853; transform: scale(1); }
        50% { transform: scale(1.02); }
        100% { background-color: #f0ebf8; transform: scale(1); }
      }

      .scan-success-animation {
        animation: scanSuccess 0.6s ease-out;
      }

      /* 按鈕 hover 效果 */
      #start-camera-btn:hover { background: #1557b0; }
      #stop-camera-btn:hover { background: #b31412; }
      #manual-scan-btn:hover { background: #5e35b1; }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 標題卡片 -->
      <div class="header-card">
        <div class="header-banner"></div>
        <div class="header-content">
          <h1>電腦軟體版本更新稽核紀錄</h1>
          <p id="userInfo" style="color: #5f6368; font-size: 14px; margin-top: 8px; display: none;">
            登入使用者：<span id="userName"></span>
          </p>
        </div>
      </div>

      <form id="myForm">
        <!-- 條碼掃描功能卡片 -->
        <div class="question-card">
          <h2>快速掃描財產編號 <span style="font-size: 14px; color: #5f6368; font-weight: 400;">(可選)</span></h2>

          <!-- 手動輸入條碼 -->
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 14px; color: #5f6368; margin-bottom: 8px;">手動輸入條碼</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="barcode-input" placeholder="輸入條碼後按 Enter..."
                     style="flex: 1; padding: 12px 16px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px;">
              <button type="button" id="manual-scan-btn"
                      style="padding: 12px 24px; background: #673ab7; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500;">
                查詢
              </button>
            </div>
            <p id="barcode-error" style="color: #d93025; font-size: 14px; margin-top: 8px; display: none;">找不到此財產編號</p>
          </div>

          <!-- 鏡頭掃描按鈕 -->
          <button type="button" id="start-camera-btn"
                  style="width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: 500; margin-bottom: 12px;">
            📷 啟動鏡頭掃描
          </button>
          <button type="button" id="stop-camera-btn"
                  style="width: 100%; padding: 14px; background: #d93025; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: 500; display: none;">
            ⏹ 停止掃描
          </button>

          <!-- 掃描預覽區域 -->
          <div id="scanner-preview" style="display: none; margin-top: 16px; background: #f8f9fa; padding: 16px; border-radius: 8px;">
            <div style="margin-bottom: 12px;">
              <label style="font-size: 13px; color: #5f6368;">選擇相機：</label>
              <select id="camera-select" style="width: 100%; padding: 8px; border: 1px solid #dadce0; border-radius: 4px; margin-top: 4px;"></select>
            </div>
            <div id="scanner-reader" style="position: relative; width: 100%; min-height: 250px; background: #2c2c2c; border-radius: 8px; overflow: hidden;"></div>
            <div id="scan-result" style="margin-top: 12px; padding: 12px; background: white; border-radius: 4px; text-align: center; color: #5f6368;">
              等待掃描條碼...
            </div>
          </div>
        </div>

        <!-- 問題1: 駐站 -->
        <div class="question-card">
          <h2>請選擇您的駐站</h2>
          <select id="groupSelect" name="group" onchange="updateComputerOptions(this.value)">
            <option value="">載入中...</option>
          </select>
        </div>

        <!-- 問題2: 電腦產編 -->
        <div class="question-card">
          <h2>請選擇電腦產編</h2>
          <select id="computerSelect" name="computer">
            <option value="">載入中...</option>
          </select>
        </div>

        <!-- 問題3: 軟體資訊回報 -->
        <div class="question-card">
          <h2>軟體資訊回報</h2>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="winUpdateCheck">
              <label for="winUpdateCheck">Windows 是否更新至最新版本</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="chromeUpdateCheck">
              <label for="chromeUpdateCheck">Chrome 是否新增至最新版本</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="antivirusDefCheck">
              <label for="antivirusDefCheck">防毒軟體病毒碼是否為最新版本</label>
            </div>
          </div>
        </div>

        <!-- 問題4: 7-Zip 版本 -->
        <div class="question-card">
          <h2>7-Zip 版本</h2>
          <select id="sevenZipVersion" name="sevenZipVersion">
            <option value="">載入中...</option>
          </select>
        </div>

        <!-- 問題5: TeamViewer 版本 -->
        <div class="question-card">
          <h2>TeamViewer 版本</h2>
          <input type="text" id="teamViewerVersion" name="teamViewerVersion" placeholder="請輸入 TeamViewer 版本（例如：15.0.0 或 無安裝）">
        </div>

        <!-- 問題6: Forticlient 版本 -->
        <div class="question-card">
          <h2>Forticlient VPN 版本</h2>
          <input type="text" id="forticlientVersion" name="forticlientVersion" placeholder="請輸入 Forticlient 版本（例如：7.2.1 或 無安裝）">
        </div>

        <!-- 問題7: Adobe Acrobat 版本 -->
        <div class="question-card">
          <h2>Adobe Acrobat 版本</h2>
          <input type="text" id="adobeAcrobatVersion" name="adobeAcrobatVersion" placeholder="請輸入 Adobe Acrobat 版本（例如：2024.001 或 無安裝）">
        </div>

        <!-- 問題8: 備註 -->
        <div class="question-card">
          <h2>備註</h2>
          <textarea id="notes" name="notes" placeholder="如有其他需要說明的事項,請在此填寫..."></textarea>
        </div>

        <!-- 提交按鈕 -->
        <div class="submit-card">
          <input type="submit" value="提交">
          <div id="status"></div>
        </div>
      </form>
    </div>

    <script>
      let dataMap = {};
      let sevenZipVersions = [];

      // ==================== 條碼掃描相關變數 ====================
      let isScanning = false;
      let lastScannedCode = '';
      let scanCooldown = null;
      let currentStream = null;
      let computerToStationMap = {}; // 反向索引：電腦產編 -> 駐站

      // ==================== 進度條控制變數 ====================
      let _loaderIntervalId;
      let _dataLoadStatus = {
        selectData: false,
        sevenZipData: false,
        userData: false
      };

      /**
       * 顯示進度條載入動畫
       * @param {string} text - 顯示的載入訊息（選填,預設為「頁面載入中...」）
       */
      function showLoader(text = '頁面載入中...') {
        const _loaderOverlay = document.getElementById('loaderOverlay');
        const _progressBar = document.getElementById('progressBar');
        const _loadingText = document.getElementById('loadingText');

        let progress = 0;
        _progressBar.style.width = '0%';
        _progressBar.textContent = '0%';
        _loadingText.textContent = text;
        _loaderOverlay.style.display = 'flex';

        // 模擬一個平滑的進度條,直到 90%
        _loaderIntervalId = setInterval(() => {
          if (progress < 90) {
            progress += Math.floor(Math.random() * 5) + 1;
            if (progress > 90) progress = 90;
            _progressBar.style.width = progress + '%';
            _progressBar.textContent = progress + '%';
          }
        }, 200);
      }

      /**
       * 隱藏進度條載入動畫
       * @param {string} text - 顯示的完成訊息（選填,預設為「載入完成！」）
       */
      function hideLoader(text = '載入完成！') {
        const _loaderOverlay = document.getElementById('loaderOverlay');
        const _progressBar = document.getElementById('progressBar');
        const _loadingText = document.getElementById('loadingText');

        clearInterval(_loaderIntervalId); // 停止模擬進度

        _progressBar.style.width = '100%';
        _progressBar.textContent = '100%';
        _loadingText.textContent = text;

        setTimeout(() => {
          _loaderOverlay.style.display = 'none';
        }, 500);
      }

      /**
       * 檢查所有資料是否載入完成
       */
      function checkDataLoadComplete() {
        if (_dataLoadStatus.selectData && _dataLoadStatus.sevenZipData && _dataLoadStatus.userData) {
          hideLoader('載入完成！');
        }
      }

      // ==================== 條碼掃描功能 ====================

      /**
       * 建立反向索引（電腦產編 -> 駐站）
       */
      function buildReverseIndex() {
        computerToStationMap = {};
        Object.keys(dataMap).forEach(station => {
          dataMap[station].forEach(computer => {
            computerToStationMap[computer] = station;
          });
        });
        console.log('反向索引已建立，共', Object.keys(computerToStationMap).length, '筆資料');
      }

      /**
       * 格式化條碼：去掉前2位，並插入連字號
       * 格式：18XXXXXXXXXXXXXXXXX -> XXXXXXX-XXXX-XXXXXXX
       *
       * @param {string} barcode - 原始條碼
       * @returns {string} - 格式化後的條碼
       */
      function formatBarcode(barcode) {
        if (!barcode) return '';

        const cleanCode = barcode.trim();

        // 如果條碼長度小於2，無法處理
        if (cleanCode.length < 2) {
          console.warn('條碼長度不足，無法格式化:', cleanCode);
          return cleanCode;
        }

        // 去掉前2位
        let processed = cleanCode.substring(2);

        // 如果去掉前2位後長度不足11位，直接返回（無法格式化）
        if (processed.length < 11) {
          console.warn('去掉前2位後長度不足，返回處理後的條碼:', processed);
          return processed;
        }

        // 格式化為 XXXXXXX-XXXX-XXXXXXX
        // 位置 0-6 (7位) + "-" + 位置 7-10 (4位) + "-" + 剩餘位數
        const formatted = processed.substring(0, 7) + '-' +
                          processed.substring(7, 11) + '-' +
                          processed.substring(11);

        console.log('條碼格式化:', cleanCode, '->', formatted);
        return formatted;
      }

      /**
       * 根據條碼查詢並自動填寫表單
       */
      function processBarcodeInput(barcode, isFromCamera = false) {
        if (!barcode || barcode.trim() === '') return;

        const originalBarcode = barcode.trim(); // 原始條碼
        const formattedBarcode = formatBarcode(originalBarcode); // 格式化後的條碼

        const errorEl = document.getElementById('barcode-error');
        const resultEl = document.getElementById('scan-result');

        // 先用格式化後的條碼查詢
        let station = computerToStationMap[formattedBarcode];
        let finalBarcode = formattedBarcode;

        // 如果找不到，嘗試用原始條碼查詢（向下相容）
        if (!station) {
          station = computerToStationMap[originalBarcode];
          finalBarcode = originalBarcode;

          console.log('格式化條碼未找到，使用原始條碼查詢:', originalBarcode);
        }

        if (station) {
          // 找到對應的駐站，自動填寫表單
          document.getElementById('groupSelect').value = station;
          updateComputerOptions(station); // 更新電腦產編下拉選單

          // 等待下拉選單更新後選擇電腦
          setTimeout(() => {
            document.getElementById('computerSelect').value = finalBarcode;

            // 視覺回饋
            const groupCard = document.getElementById('groupSelect').closest('.question-card');
            const computerCard = document.getElementById('computerSelect').closest('.question-card');

            groupCard.classList.add('scan-success-animation');
            computerCard.classList.add('scan-success-animation');

            setTimeout(() => {
              groupCard.classList.remove('scan-success-animation');
              computerCard.classList.remove('scan-success-animation');
            }, 600);

            // 滾動到電腦產編欄位
            computerCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);

          // 清空輸入框
          document.getElementById('barcode-input').value = '';
          errorEl.style.display = 'none';

          if (isFromCamera) {
            // 顯示原始條碼和格式化後的條碼（如果不同）
            const displayText = originalBarcode !== formattedBarcode
              ? '✓ 掃描成功<br><small style="font-size: 12px;">原始: ' + originalBarcode + '</small><br>' + station + ' - ' + finalBarcode
              : '✓ 掃描成功：' + station + ' - ' + finalBarcode;

            resultEl.innerHTML = '<span style="color: #34a853; font-weight: bold;">' + displayText + '</span>';
          } else {
            const alertText = originalBarcode !== formattedBarcode
              ? '查詢成功！\n原始條碼：' + originalBarcode + '\n格式化後：' + formattedBarcode + '\n駐站：' + station + '\n電腦產編：' + finalBarcode
              : '查詢成功！\n駐站：' + station + '\n電腦產編：' + finalBarcode;

            alert(alertText);
          }

        } else {
          // 找不到對應的財產編號
          errorEl.style.display = 'block';
          errorEl.textContent = '找不到此財產編號（嘗試了原始碼和格式化碼）';

          if (isFromCamera) {
            const displayText = originalBarcode !== formattedBarcode
              ? '✗ 找不到<br><small>原始: ' + originalBarcode + '</small><br>格式化: ' + formattedBarcode
              : '✗ 找不到財產編號：' + originalBarcode;

            resultEl.innerHTML = '<span style="color: #d93025;">' + displayText + '</span>';
          }

          console.error('找不到條碼: 原始=' + originalBarcode + ', 格式化=' + formattedBarcode);
        }
      }

      /**
       * 啟動鏡頭掃描
       */
      function startCameraScanning() {
        document.getElementById('start-camera-btn').style.display = 'none';
        document.getElementById('stop-camera-btn').style.display = 'block';
        document.getElementById('scanner-preview').style.display = 'block';
        isScanning = true;

        initQuagga();
      }

      /**
       * 停止鏡頭掃描
       */
      async function stopCameraScanning() {
        if (!isScanning) return;

        isScanning = false;
        await stopQuagga();

        document.getElementById('start-camera-btn').style.display = 'block';
        document.getElementById('stop-camera-btn').style.display = 'none';
        document.getElementById('scanner-preview').style.display = 'none';
        document.getElementById('scan-result').innerHTML = '等待掃描條碼...';
      }

      /**
       * 初始化 Quagga 掃描器
       */
      function initQuagga(deviceId = null) {
        const constraints = {
          width: { min: 640 },
          height: { min: 480 },
          aspectRatio: { min: 1, max: 2 }
        };

        if (deviceId) {
          constraints.deviceId = { exact: deviceId };
        } else {
          constraints.facingMode = "environment"; // 後置鏡頭
        }

        const config = {
          inputStream: {
            name: "Live",
            type: "LiveStream",
            target: document.querySelector('#scanner-reader'),
            constraints: constraints
          },
          decoder: {
            readers: [
              "code_128_reader", "ean_reader", "ean_8_reader",
              "code_39_reader", "codabar_reader", "upc_reader"
            ],
            debug: {
              drawBoundingBox: true,
              drawScanline: true
            }
          },
          locate: true,
          numOfWorkers: navigator.hardwareConcurrency || 4
        };

        Quagga.init(config, function(err) {
          if (err) {
            console.error('Quagga 初始化失敗:', err);
            alert('啟動掃描器失敗：' + err.message);
            stopCameraScanning();
            return;
          }

          console.log("Quagga 初始化成功");
          Quagga.onDetected(onBarcodeDetected);
          Quagga.start();

          setTimeout(() => {
            const videoEl = document.querySelector('#scanner-reader video');
            if (videoEl && videoEl.srcObject) {
              currentStream = videoEl.srcObject;
            }
            populateCameraList();
          }, 500);
        });
      }

      /**
       * 條碼偵測回調
       */
      function onBarcodeDetected(data) {
        if (!data || !data.codeResult) return;

        const code = data.codeResult.code;

        // 防止重複掃描
        if (code === lastScannedCode && scanCooldown) return;

        lastScannedCode = code;
        clearTimeout(scanCooldown);
        scanCooldown = setTimeout(() => {
          lastScannedCode = '';
        }, 2000);

        processBarcodeInput(code, true);
      }

      /**
       * 填充相機列表
       */
      async function populateCameraList() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === 'videoinput');

          if (videoDevices.length <= 1) {
            document.getElementById('camera-select').parentElement.style.display = 'none';
            return;
          }

          const selectEl = document.getElementById('camera-select');
          selectEl.innerHTML = '';

          let currentDeviceId = null;
          const videoEl = document.querySelector('#scanner-reader video');
          if (videoEl && videoEl.srcObject) {
            const track = videoEl.srcObject.getVideoTracks()[0];
            currentDeviceId = track.getSettings().deviceId;
          }

          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.textContent = device.label || '相機 ' + (index + 1);
            if (device.deviceId === currentDeviceId) {
              option.selected = true;
            }
            selectEl.appendChild(option);
          });

        } catch (err) {
          console.error('填充相機列表失敗:', err);
        }
      }

      /**
       * 停止 Quagga
       */
      async function stopQuagga() {
        return new Promise((resolve) => {
          try {
            if (currentStream) {
              currentStream.getTracks().forEach(track => track.stop());
              currentStream = null;
            }

            const videoEl = document.querySelector('#scanner-reader video');
            if (videoEl && videoEl.srcObject) {
              videoEl.srcObject.getTracks().forEach(track => track.stop());
              videoEl.srcObject = null;
            }

            Quagga.offDetected(onBarcodeDetected);
            Quagga.stop();

            const readerEl = document.querySelector('#scanner-reader');
            if (readerEl) {
              while (readerEl.firstChild) {
                readerEl.removeChild(readerEl.firstChild);
              }
            }

          } catch (err) {
            console.error('停止 Quagga 時發生錯誤:', err);
          }

          setTimeout(resolve, 200);
        });
      }

      /**
       * 設置掃描相關事件監聽器
       */
      function setupBarcodeEventListeners() {
        // 手動輸入條碼
        document.getElementById('barcode-input').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            processBarcodeInput(document.getElementById('barcode-input').value);
          }
        });

        document.getElementById('manual-scan-btn').addEventListener('click', () => {
          processBarcodeInput(document.getElementById('barcode-input').value);
        });

        // 鏡頭掃描按鈕
        document.getElementById('start-camera-btn').addEventListener('click', startCameraScanning);
        document.getElementById('stop-camera-btn').addEventListener('click', stopCameraScanning);

        // 相機切換
        document.getElementById('camera-select').addEventListener('change', async (e) => {
          if (isScanning) {
            const newCameraId = e.target.value;
            e.target.disabled = true;
            await stopQuagga();
            setTimeout(() => {
              if (isScanning) {
                initQuagga(newCameraId);
                setTimeout(() => {
                  e.target.disabled = false;
                }, 500);
              }
            }, 300);
          }
        });
      }

      // ==================== 原有功能繼續 ====================

      document.addEventListener("DOMContentLoaded", function() {
        // 立即顯示進度條
        showLoader('正在載入表單資料...');

        // 同時載入組別資料、7-Zip 版本清單和使用者資訊
        google.script.run.withSuccessHandler(populateGroupSelect).getSelectData();
        google.script.run.withSuccessHandler(populateSevenZipVersions).getSevenZipVersions();
        google.script.run.withSuccessHandler(displayUserInfo).getCurrentUser();

        // ✅ 新增：初始化條碼掃描事件監聽器
        setupBarcodeEventListeners();
      });

      /**
       * 顯示當前登入使用者資訊
       * @param {object} userInfo - 使用者資訊物件
       */
      function displayUserInfo(userInfo) {
        if (userInfo && userInfo.isAuthenticated) {
          const userInfoEl = document.getElementById('userInfo');
          const userNameEl = document.getElementById('userName');
          userNameEl.textContent = userInfo.email;
          userInfoEl.style.display = 'block';
        }
        
        // 標記使用者資料已載入完成
        _dataLoadStatus.userData = true;
        checkDataLoadComplete();
      }

      function populateGroupSelect(data) {
        dataMap = data;
        const groupSelect = document.getElementById("groupSelect");

        // 清空載入中的選項
        groupSelect.innerHTML = '';

        // 添加預設選項
        groupSelect.add(new Option("請選擇...", ""));

        // 添加組別選項
        const groups = Object.keys(dataMap).sort();
        groups.forEach(group => {
          const option = new Option(group, group);
          groupSelect.add(option);
        });

        // 更新電腦選單為初始狀態
        const computerSelect = document.getElementById("computerSelect");
        computerSelect.innerHTML = '';
        computerSelect.add(new Option("--請先選擇駐站--", ""));

        // 標記此資料已載入完成
        _dataLoadStatus.selectData = true;
        checkDataLoadComplete();

        // ✅ 新增：建立反向索引（電腦產編 -> 駐站）
        buildReverseIndex();
      }

      function populateSevenZipVersions(versions) {
        sevenZipVersions = versions;
        const sevenZipSelect = document.getElementById("sevenZipVersion");

        // 清空載入中的選項
        sevenZipSelect.innerHTML = '';

        // 添加預設選項
        sevenZipSelect.add(new Option("請選擇版本...", ""));
        sevenZipSelect.add(new Option("無安裝", "無"));

        // 添加版本選項
        versions.forEach(version => {
          const option = new Option(version, version);
          sevenZipSelect.add(option);
        });

        // 標記此資料已載入完成
        _dataLoadStatus.sevenZipData = true;
        checkDataLoadComplete();
      }

      function updateComputerOptions(selectedGroup) {
        const computerSelect = document.getElementById("computerSelect");
        computerSelect.innerHTML = '';
        
        if (selectedGroup && dataMap[selectedGroup]) {
          // 有選擇組別時,先添加預設選項再添加電腦清單
          computerSelect.add(new Option("請選擇...", ""));
          const computers = dataMap[selectedGroup].sort();
          computers.forEach(computer => {
            const option = new Option(computer, computer);
            computerSelect.add(option);
          });
        } else {
          // 沒有選擇組別時,顯示提示訊息
          computerSelect.add(new Option("--請先選擇組別--", ""));
        }
      }

      // 改良版表單提交處理
      document.getElementById("myForm").addEventListener("submit", function(e) {
        e.preventDefault();

        // 手動建立表單物件,確保勾選狀態正確傳送
        const formObject = {
          group: document.getElementById("groupSelect").value,
          computer: document.getElementById("computerSelect").value,
          notes: document.getElementById("notes").value,
          sevenZipVersion: document.getElementById("sevenZipVersion").value,
          teamViewerVersion: document.getElementById("teamViewerVersion").value,
          forticlientVersion: document.getElementById("forticlientVersion").value,
          adobeAcrobatVersion: document.getElementById("adobeAcrobatVersion").value,
          // 明確設定勾選狀態
          winUpdated: document.getElementById("winUpdateCheck").checked,
          chromeUpdated: document.getElementById("chromeUpdateCheck").checked,
          antivirusUpdated: document.getElementById("antivirusDefCheck").checked
        };

        // 調試:在瀏覽器控制台顯示要送出的資料
        console.log("準備送出的表單資料：", formObject);
        console.log("Windows 勾選狀態：", formObject.winUpdated);
        console.log("Chrome 勾選狀態：", formObject.chromeUpdated);
        console.log("防毒軟體勾選狀態：", formObject.antivirusUpdated);
        console.log("7-Zip 版本：", formObject.sevenZipVersion);
        console.log("TeamViewer 版本：", formObject.teamViewerVersion);
        console.log("Forticlient 版本：", formObject.forticlientVersion);
        console.log("Adobe Acrobat 版本：", formObject.adobeAcrobatVersion);

        // 顯示進度條
        showLoader('正在提交表單...');
        document.getElementById("status").textContent = "提交中...";

        google.script.run
          .withSuccessHandler(function(response) {
            // 隱藏進度條
            hideLoader('提交完成！');

            const statusEl = document.getElementById("status");
            statusEl.textContent = response;
            statusEl.className = response.startsWith("回報成功") ? "show success" : "show";
            if (response.startsWith("回報成功")) {
              document.getElementById("myForm").reset();
              updateComputerOptions('');
              // 3秒後隱藏成功訊息
              setTimeout(function() {
                statusEl.className = "";
              }, 3000);
            }
          })
          .withFailureHandler(function(error) {
            // 隱藏進度條
            hideLoader('提交失敗！');

            const statusEl = document.getElementById("status");
            statusEl.textContent = "提交失敗：" + error.message;
            statusEl.className = "show error";
            statusEl.style.backgroundColor = "#ffebee";
            statusEl.style.color = "#c62828";
            console.error("提交錯誤：", error);
          })
          .processFormData(formObject);
      });
      // 當頁面載入完成後執行
      document.addEventListener("DOMContentLoaded", function() {
        // 呼叫後端的 getAppUrl() 函式
        google.script.run.withSuccessHandler(function(url) {
          // 成功取得 URL 後,在後面加上 ?page=test 參數
          var testPageUrl = url + "?page=test";
          // 將產生的 URL 設定到 <a> 標籤的 href 屬性
          document.getElementById("testLink").href = testPageUrl;
        }).getAppUrl();
      });
    </script>
